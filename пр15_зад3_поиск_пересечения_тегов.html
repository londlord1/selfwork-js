<h1>ПР15 • Зад.3 • Поиск пересечения тегов</h1>
<div class="desc">Реализуйте commonTags(setA, setB), находящую общие теги двух статей (Set); верните новый Set.</div>

<div class="card">
<button class="btn" onclick="runInter()">commonTags(статья1, статья2)</button>
</div>
<div class="out" id="out">Нажмите кнопку.</div>
<script>
const articleA=new Set(['js','react','css','html']);
const articleB=new Set(['js','python','react','node']);
function commonTags(a,b){return new Set([...a].filter(t=>b.has(t)));}
function runInter(){const r=commonTags(articleA,articleB);document.getElementById('out').innerHTML=`Статья 1: [${[...articleA].join(', ')}]
Статья 2: [${[...articleB].join(', ')}]

<span class="hl">Общие теги:</span> <span class="ok">[${[...r].join(', ')}]</span> ${r.size} шт.`;}
</script>
