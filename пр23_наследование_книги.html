<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>ПР23 • Наследование</title>
<style>body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;padding:24px}.container{max-width:700px;margin:0 auto}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);margin-bottom:15px}.item{border-bottom:1px solid #eee;padding:10px 0}.item:last-child{border:none}.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;color:#fff;margin-left:10px}.ebook{background:#17a2b8}.audio{background:#ffc107;color:#333}.edu{background:#28a745}</style>
</head><body>
<div class="container">
  <div class="card">
    <h2>Коллекция книг (Полиморфизм)</h2>
    <div id="list"></div>
  </div>
</div>
<script>
class Book {
    constructor(title, author, year) { this.title = title; this.author = author; this.year = year; }
    getInfo() { return `${this.title} — ${this.author} (${this.year})`; }
}
class EBook extends Book {
    constructor(title, author, year, format) { super(title, author, year); this.format = format; }
    getInfo() { return `${super.getInfo()} [Электронная, ${this.format}]`; }
}
class AudioBook extends Book {
    constructor(title, author, year, narrator) { super(title, author, year); this.narrator = narrator; }
    getInfo() { return `${super.getInfo()} [Аудио, чтец: ${this.narrator}]`; }
}

// Задание 1: EducationalBook
class EducationalBook extends Book {
    constructor(title, author, year, subject, level = 'beginner') {
        super(title, author, year);
        this.subject = subject;
        this.level = level;
    }
    getInfo() {
        const levelMap = { beginner: 'Начальный', intermediate: 'Средний', advanced: 'Продвинутый' };
        return `${super.getInfo()} [Учебник по ${this.subject}, ${levelMap[this.level] || this.level}]`;
    }
}

// Задание 3: Collection
class Collection {
    constructor() { this.books = []; }
    addBook(book) { this.books.push(book); }
    getAllBooks() { return this.books; }
    getByType(type) {
        if (type === 'ebook') return this.books.filter(b => b instanceof EBook);
        if (type === 'audiobook') return this.books.filter(b => b instanceof AudioBook);
        if (type === 'educational') return this.books.filter(b => b instanceof EducationalBook);
        return this.books.filter(b => !(b instanceof EBook) && !(b instanceof AudioBook) && !(b instanceof EducationalBook));
    }
}

const col = new Collection();
col.addBook(new Book('Война и мир', 'Толстой', 1869));
col.addBook(new EBook('1984', 'Оруэлл', 1949, 'EPUB'));
col.addBook(new AudioBook('Гарри Поттер', 'Роулинг', 1997, 'Кирилл'));
col.addBook(new EducationalBook('Алгебра 9 класс', 'Макарычев', 2018, 'Математика', 'intermediate'));

const renderList = (books) => books.map(b => `<div class="item">${b.getInfo()}</div>`).join('');
document.getElementById('list').innerHTML = `
    <h3>Все книги:</h3> ${renderList(col.getAllBooks())}
    <h3 style="margin-top:20px">Только Учебники (Фильтр):</h3> ${renderList(col.getByType('educational'))}
`;
</script>
</body></html>
