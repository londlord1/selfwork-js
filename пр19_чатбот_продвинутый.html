<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>ПР19 • Чат-бот</title>
<style>body{font-family:'Segoe UI',sans-serif;background:#667eea;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.chat{width:400px;height:600px;background:#fff;border-radius:15px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.2)}.header{background:#4a5568;color:#fff;padding:15px;text-align:center;font-weight:bold}.messages{flex:1;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:#f7fafc}.msg{max-width:80%;padding:10px;border-radius:10px;font-size:14px}.bot{background:#e2e8f0;align-self:flex-start;border-bottom-left-radius:0}.user{background:#4299e1;color:#fff;align-self:flex-end;border-bottom-right-radius:0}.input-area{display:flex;padding:10px;background:#fff;border-top:1px solid #eee}.input-area input{flex:1;padding:10px;border:1px solid #ccc;border-radius:20px;outline:none}.input-area button{background:#48bb78;color:#fff;border:none;border-radius:50%;width:40px;height:40px;margin-left:10px;cursor:pointer}</style>
</head><body>
<div class="chat">
  <div class="header">🤖 Умный Бот</div>
  <div class="messages" id="chat-messages">
    <div class="msg bot">Привет! Я умею считать (например, 2+2) и знаю историю.</div>
  </div>
  <div class="input-area">
    <input type="text" id="msg-input" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter') send()">
    <button onclick="send()">➤</button>
  </div>
</div>
<script>
const chat = document.getElementById('chat-messages');
const input = document.getElementById('msg-input');
let history = []; // Задание 6: История

function addMsg(text, sender) {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    if (sender === 'user') history.push(text);
}

function send() {
    const text = input.value.trim();
    if (!text) return;
    addMsg(text, 'user');
    input.value = '';
    
    setTimeout(() => {
        let response = getResponse(text);
        addMsg(response, 'bot');
    }, 500);
}

function getResponse(msg) {
    const lower = msg.toLowerCase();
    
    // Задание 5: Калькулятор
    if (/[\+\-\*\/]/.test(lower)) {
        try {
            // Безопасное вычисление через Function
            const result = Function('"use strict";return (' + msg + ')')();
            if (result !== undefined && !isNaN(result)) {
                return `Результат: ${result}`;
            }
        } catch (e) {
            return "Не могу вычислить. Проверьте выражение.";
        }
    }

    // Задание 6: Показать историю
    if (lower.includes('история')) {
        return "Ваши сообщения:\n" + history.join('\n');
    }

    // Задание 2: День рождения
    if (lower.includes('день рождения') || lower.includes('с днём рождения')) {
        return "С днём рождения! 🎉 Желаю счастья!";
    }
    
    if (lower.includes('привет')) return "Привет! Как дела?";
    if (lower.includes('как тебя зовут')) return "Я Бот-помощник!";
    if (lower.includes('пока')) return "До свидания!";

    return "Я не совсем понял. Попробуйте спросить про 'историю' или введите пример '2+2'.";
}
</script>
</body></html>
