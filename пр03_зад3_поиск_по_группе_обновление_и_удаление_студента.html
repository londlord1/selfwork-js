<h1>ПР03 • Зад.3 • Поиск по группе, обновление и удаление студента</h1>
<div class="desc">Реализуйте работу со студентами: <b>findByGroup(group)</b>, <b>updateStudent(id, newData)</b>, <b>deleteStudent(id)</b>.</div>

<div class="card">
<h2>Студенты</h2>
<div id="students"></div>
<style>.stu{border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;margin:6px 0;font-size:14px}</style>
<button class="btn" onclick="runByGroup('ИС-201')">findByGroup('ИС-201')</button>
<button class="btn green" onclick="runUpdate()">updateStudent(2, {grade: 98})</button>
<button class="btn red" onclick="runDelete(4)">deleteStudent(4)</button><br>
</div>
<div class="out" id="out">Нажмите кнопку.</div>
<script>
let students=[{id:1,name:'Алексей',age:20,group:'ИС-201',grade:85},{id:2,name:'Мария',age:19,group:'ИС-202',grade:92},{id:3,name:'Иван',age:21,group:'ИС-201',grade:78},{id:4,name:'Екатерина',age:20,group:'ИС-203',grade:95}];
function renderStu(){document.getElementById('students').innerHTML=students.map(s=>'<div class="stu">🎓 '+s.name+' · гр.'+s.group+' · '+s.grade+' б.</div>').join('')||'<div class="err">Список пуст</div>';}
function findByGroup(g){return students.filter(s=>s.group===g);}
function updateStudent(id,data){const s=students.find(x=>x.id===id);if(s)Object.assign(s,data);return s;}
function deleteStudent(id){students=students.filter(s=>s.id!==id);}
function runByGroup(g){const o=document.getElementById('out');o.innerHTML=`<span class="hl">findByGroup("${g}")</span>

${findByGroup(g).map(s=>`- ${s.name} (${s.grade} б.)`).join('\n')}`;}
function runUpdate(){updateStudent(2,{grade:98});renderStu();document.getElementById('out').innerHTML='<span class="ok">updateStudent(2,{grade:98}) — Мария обновлена.</span>';}
function runDelete(id){deleteStudent(id);renderStu();document.getElementById('out').innerHTML='<span class="err">deleteStudent('+id+') — студент удалён.</span>';}
renderStu();
</script>
