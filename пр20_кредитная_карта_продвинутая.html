<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>ПР20 • Кредитная карта</title>
<style>body{font-family:'Segoe UI',sans-serif;background:#e0e5ec;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.container{background:#fff;padding:30px;border-radius:20px;width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}.card{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:20px;border-radius:15px;margin-bottom:20px;min-height:200px;position:relative}.card.unionpay{background:linear-gradient(135deg,#d52b1e,#b71c1c)}.card-number{font-size:22px;letter-spacing:2px;font-family:monospace;margin:20px 0}.card-bottom{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase}.form-group{margin-bottom:15px}label{display:block;font-size:12px;color:#666;margin-bottom:5px}input{width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;box-sizing:border-box;font-size:16px;font-family:monospace}input:focus{outline:none;border-color:#4a6cf7}button{width:100%;padding:12px;background:#4a6cf7;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin-top:10px}</style>
</head><body>
<div class="container">
  <div class="card" id="card">
    <div style="font-weight:bold;font-size:18px" id="brand">Bank Card</div>
    <div class="card-number" id="display-num">•••• •••• •••• ••••</div>
    <div class="card-bottom">
      <div><div>Владелец</div><div id="display-name">ИМЯ ФАМИЛИЯ</div></div>
      <div><div>Срок</div><div id="display-exp">MM/YY</div></div>
    </div>
  </div>
  <div class="form-group">
    <label>Номер карты</label>
    <input type="text" id="num" maxlength="19" placeholder="0000 0000 0000 0000">
  </div>
  <div class="form-group">
    <label>Имя владельца (англ.)</label>
    <input type="text" id="name" placeholder="IVAN IVANOV" style="font-family:'Segoe UI',sans-serif">
  </div>
  <div style="display:flex;gap:10px">
    <div class="form-group" style="flex:1"><label>Срок</label><input type="text" id="exp" maxlength="5" placeholder="MM/YY"></div>
    <div class="form-group" style="flex:1"><label>CVV</label><input type="password" id="cvv" maxlength="4" placeholder="•••"></div>
  </div>
  <button onclick="saveData()">Сохранить данные</button>
</div>
<script>
// Задание 1: UnionPay + форматирование
const numInput = document.getElementById('num');
const displayNum = document.getElementById('display-num');
const brand = document.getElementById('brand');
const card = document.getElementById('card');

numInput.addEventListener('input', function() {
    let val = this.value.replace(/\D/g, '');
    let formatted = val.match(/.{1,4}/g)?.join(' ') || '';
    this.value = formatted;
    displayNum.textContent = formatted || '•••• •••• •••• ••••';
    
    if (val.startsWith('62')) {
        brand.textContent = 'UnionPay';
        card.classList.add('unionpay');
    } else {
        brand.textContent = 'Bank Card';
        card.classList.remove('unionpay');
    }
});

document.getElementById('name').addEventListener('input', function() {
    document.getElementById('display-name').textContent = this.value.toUpperCase() || 'ИМЯ ФАМИЛИЯ';
});

document.getElementById('exp').addEventListener('input', function() {
    let val = this.value.replace(/\D/g, '');
    if (val.length >= 2) val = val.slice(0,2) + '/' + val.slice(2,4);
    this.value = val;
    document.getElementById('display-exp').textContent = val || 'MM/YY';
});

// Задание 5: LocalStorage
function saveData() {
    const data = {
        num: document.getElementById('num').value,
        name: document.getElementById('name').value,
        exp: document.getElementById('exp').value
    };
    localStorage.setItem('cardData', JSON.stringify(data));
    alert('Данные сохранены в LocalStorage (CVV не сохраняется в целях безопасности)!');
}

window.onload = function() {
    const saved = localStorage.getItem('cardData');
    if (saved) {
        const data = JSON.parse(saved);
        numInput.value = data.num;
        document.getElementById('name').value = data.name;
        document.getElementById('exp').value = data.exp;
        numInput.dispatchEvent(new Event('input'));
        document.getElementById('name').dispatchEvent(new Event('input'));
        document.getElementById('exp').dispatchEvent(new Event('input'));
    }
}
</script>
</body></html>
