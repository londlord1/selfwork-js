<style>

<body>
<div class="wrap">
<div class="topnav">
  <a href="index.html">« Хаб самостоятельных работ</a>
  <div class="navbtns"><button class="btn" disabled>← Пред.</button><button class="btn" onclick="location.href='пр18_зад1_симуляция_расширения.html'">След. →</button></div>

<span class="pr-tag">ПР17</span>
<h1>ПР17 • Зад.1 • Ограниченный счетчик</h1>
<div class="desc">Создайте фабрику createBoundedCounter(min, max), которая блокирует выход за пределы диапазона и выбрасывает ошибку, если min > max.</div>

<div class="card">
  <button class="btn" onclick="runTests()">Запустить тесты счетчика</button>
</div>
<div class="out" id="out">Нажмите кнопку для запуска...</div>

<script>
function createBoundedCounter(min, max) {
  if (min > max) throw new Error('Минимум не может быть больше максимума');
  let count = min;
  return {
    increment() {
      if (count < max) { count++; }
      else { console.warn(`Достигнут максимум: ${max}`); }
    },
    decrement() {
      if (count > min) { count--; }
      else { console.warn(`Достигнут минимум: ${min}`); }
    },
    getRange() { return { min, max, current: count }; },
    reset() { count = min; }
  };
}

function runTests() {
  const out = document.getElementById('out');
  let html = '<span class="hl">=== ТЕСТИРОВАНИЕ ===</span>\n\n';
  
  // Тест 1: Ошибка при неверных значениях
  try {
    createBoundedCounter(5, 0);
    html += '<span class="err">ОШИБКА: Не выброшено исключение при min > max</span>\n';
  } catch (e) {
    html += `<span class="ok">✓ Успешно: ${e.message}</span>\n`;
  }

  // Тест 2: Работа в диапазоне
  const score = createBoundedCounter(0, 5);
  html += `\nНачальное состояние: ${JSON.stringify(score.getRange())}\n`;
  
  for(let i=0; i<7; i++) score.increment();
  html += `После 7 инкрементов: ${JSON.stringify(score.getRange())} (должно быть 5)\n`;
  
  for(let i=0; i<7; i++) score.decrement();
  html += `После 7 декрементов: ${JSON.stringify(score.getRange())} (должно быть 0)\n`;

  // Тест 3: Reset
  score.increment(); score.increment();
  score.reset();
  html += `После reset: ${JSON.stringify(score.getRange())} (должно быть 0)\n`;

  out.innerHTML = html;
}
</script>
</body>
