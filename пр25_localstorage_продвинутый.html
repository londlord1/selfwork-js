<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>ПР25 • LocalStorage</title>
<style>body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;padding:24px}.container{max-width:600px;margin:0 auto}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}.controls{display:flex;gap:10px;margin-bottom:15px}.item{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee}.fav{color:#f1c40f;cursor:pointer}.status{font-size:12px;color:#666;margin-top:10px;text-align:right}</style>
</head><body>
<div class="container">
  <div class="card">
    <h2>Мои книги</h2>
    <div class="controls">
      <input type="text" id="title" placeholder="Название">
      <button onclick="addBook()">Добавить</button>
      <button onclick="undo()" style="background:#e67e22">Undo</button>
    </div>
    <div id="list"></div>
    <div class="status" id="status">Нет сохранений</div>
  </div>
</div>
<script>
let books = JSON.parse(localStorage.getItem('books_v2')) || [];
let history = []; // Для Undo

function save() {
    localStorage.setItem('books_v2', JSON.stringify(books));
    // Задание 1: Индикатор
    const time = new Date().toLocaleTimeString('ru-RU');
    document.getElementById('status').textContent = `Сохранено в ${time}`;
    render();
}

function addBook() {
    const title = document.getElementById('title').value.trim();
    if (!title) return;
    history.push(JSON.parse(JSON.stringify(books))); // Сохраняем снимок для Undo
    books.push({ id: Date.now(), title, isFavorite: false });
    document.getElementById('title').value = '';
    save();
}

// Задание 4: Избранное
function toggleFav(id) {
    history.push(JSON.parse(JSON.stringify(books)));
    const book = books.find(b => b.id === id);
    book.isFavorite = !book.isFavorite;
    save();
}

// Задание 2: Undo
function undo() {
    if (history.length > 0) {
        books = history.pop();
        save();
    } else {
        alert('История пуста');
    }
}

function render() {
    document.getElementById('list').innerHTML = books.map(b => `
        <div class="item">
            <span>${b.title}</span>
            <span class="fav" onclick="toggleFav(${b.id})">${b.isFavorite ? '★' : '☆'}</span>
        </div>
    `).join('');
}
render();
</script>
</body></html>
