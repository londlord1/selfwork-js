<h1>ПР04 • Зад.1 • Свои функции: multiply, isEven, getFullName</h1>
<div class="desc">Создайте собственные функции: <b>multiply(a,b)</b>, <b>isEven(n)</b>, <b>getFullName(first,last)</b>.</div>

<div class="card">
<label>Число a:</label><input id="a" type="number" value="6">
<label>Число b:</label><input id="b" type="number" value="7">
<label>Имя:</label><input id="fn" value="Анна">
<label>Фамилия:</label><input id="ln" value="Иванова"><br>
<button class="btn" onclick="runMul()">multiply(a,b)</button>
<button class="btn green" onclick="runEven()">isEven(a)</button>
<button class="btn orange" onclick="runName()">getFullName()</button>
</div>
<div class="out" id="out">Нажмите кнопку.</div>
<script>
function multiply(a,b){return a*b;}
function isEven(n){return n%2===0;}
function getFullName(a,b){return a+' '+b;}
function v(id){return parseFloat(document.getElementById(id).value);}
function runMul(){const o=document.getElementById('out');o.innerHTML='<span class="hl">multiply('+v('a')+', '+v('b')+')</span> = <span class="ok">'+multiply(v('a'),v('b'))+'</span>';}
function runEven(){const o=document.getElementById('out');const x=v('a');o.innerHTML='<span class="hl">isEven('+x+')</span> = '+(isEven(x)?'<span class="ok">true (чётное)</span>':'<span class="err">false (нечётное)</span>');}
function runName(){const o=document.getElementById('out');o.innerHTML='<span class="hl">getFullName()</span> = <span class="ok">'+getFullName(document.getElementById('fn').value,document.getElementById('ln').value)+'</span>';}
</script>
