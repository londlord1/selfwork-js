<h1>ПР07 • Зад.1 • Пароль: минимум 8 символов</h1>
<div class="desc">Измените минимальную длину пароля на 8 символов.</div>

<div class="card">
<label>Пароль:</label><input id="pw1" oninput="check1()" placeholder="Введите пароль">
</div>
<div class="out" id="out1">Введите пароль.</div>
<script>
function check1(){const p=document.getElementById('pw1').value;const o=document.getElementById('out1');o.innerHTML=p.length===0?'Введите пароль':(p.length>=8?'<span class="ok">✅ Пароль валиден (8+ символов)</span>':'<span class="err">❌ Нужно минимум 8 символов (сейчас '+p.length+')</span>');}
</script>
