<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ПР03 • Зад.1 • Простые числа, квадраты, произведение</title>
</head>
<body>

  <h1>ПР03 • Зад.1 • Простые числа, квадраты, произведение</h1>
  <p>Функции: getPrimes() — простые, getSquares() — квадраты, getProduct() — произведение.</p>
  <div id="out"></div>

<script>
  // Данные
  const числами = [12, 7, 23, 45, 18, 31, 6, 2, 19, 8];

  // Вспомогательная проверка: простое ли число
  function isPrime(n) {
    if (n < 2) return false;            // 0 и 1 — не простые
    for (let i = 2; i * i <= n; i++) {  // достаточно идти до √n
      if (n % i === 0) return false;    // нашёлся делитель — не простое
    }
    return true;
  }

  // getPrimes() — только простые числа массива
  function getPrimes() {
    return числами.filter(isPrime);
  }

  // getSquares() — квадраты всех чисел
  function getSquares() {
    return числами.map(n => n * n);
  }

  // getProduct() — произведение всех чисел через reduce
  function getProduct() {
    return числами.reduce((acc, n) => acc * n, 1); // 1 — начальный аккумулятор
  }

  // Вывод
  console.log('Простые:', getPrimes());
  console.log('Квадраты:', getSquares());
  console.log('Произведение:', getProduct());

  document.getElementById('out').innerHTML =
    '<p><b>Данные:</b> [' + числами.join(', ') + ']</p>' +
    '<p><b>Простые:</b> [' + getPrimes().join(', ') + ']</p>' +
    '<p><b>Квадраты:</b> [' + getSquares().join(', ') + ']</p>' +
    '<p><b>Произведение:</b> ' + getProduct() + '</p>';
</script>

</body>
</html>
