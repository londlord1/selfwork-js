<h1>ПР13 • Зад.2 • Подсчёт товаров по категориям (reduce)</h1>
<div class="desc">Используя reduce, создайте объект: ключ — категория, значение — количество товаров в ней.</div>

<div class="card">
<button class="btn" onclick="runCount()">countByCategory()</button>
</div>
<div class="out" id="out">Нажмите кнопку.</div>
<script>
const warehouse=[
 {id:1,name:'Ноутбук',price:1000,quantity:4,category:'tech'},
 {id:2,name:'Мышь',price:50,quantity:15,category:'tech'},
 {id:3,name:'Клавиатура',price:80,quantity:10,category:'tech'},
 {id:4,name:'Стол',price:300,quantity:2,category:'furniture'},
 {id:5,name:'Стул',price:150,quantity:8,category:'furniture'},
 {id:6,name:'Лампа',price:40,quantity:20,category:'lighting'},
 {id:7,name:'Монитор',price:700,quantity:5,category:'tech'}
];
function countByCategory(){return warehouse.reduce((acc,i)=>{acc[i.category]=(acc[i.category]||0)+1;return acc;},{});}
function runCount(){const r=countByCategory();const o=document.getElementById('out');o.innerHTML=`<span class="hl">reduce → { категория: количество }</span>

${Object.entries(r).map(([k,v])=>`• ${k}: <span class="ok">${v}</span>`).join('\n')}

Ожидалось: { tech: 4, furniture: 2, lighting: 1 }`;}
</script>
