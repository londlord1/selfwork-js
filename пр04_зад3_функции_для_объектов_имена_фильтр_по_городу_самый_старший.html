<h1>ПР04 • Зад.3 • Функции для объектов: имена, фильтр по городу, самый старший</h1>
<div class="desc">Реализуйте: <b>getUserNames(arr)</b>, <b>getUsersByCity(arr, city)</b>, <b>getOldestUser(arr)</b>.</div>

<div class="card">
<label>Город:</label><input id="city" value="Москва">
<button class="btn" onclick="runNames()">getUserNames()</button>
<button class="btn green" onclick="runByCity()">getUsersByCity(city)</button>
<button class="btn orange" onclick="runOldest()">getOldestUser()</button>
</div>
<div class="out" id="out">Нажмите кнопку.<span hidden id="probe">data</span></div>
<script>
const U=[{name:'Анна',age:25,city:'Москва'},{name:'Иван',age:30,city:'СПб'},{name:'Мария',age:22,city:'Москва'},{name:'Петр',age:35,city:'Казань'}];
function getUserNames(x){return x.map(u=>u.name);}
function getUsersByCity(x,c){return x.filter(u=>u.city===c);}
function getOldestUser(x){return x.reduce((m,u)=>u.age>m.age?u:m);}
function runNames(){document.getElementById('out').innerHTML=`<span class="hl">getUserNames()</span>

${getUserNames(U).join(', ')}`;}
function runByCity(){const c=document.getElementById('city').value;const r=getUsersByCity(U,c);document.getElementById('out').innerHTML=`<span class="hl">getUsersByCity("${c}")</span>

${r.length?r.map(u=>`- ${u.name} (${u.age} лет)`).join('\n'):'— никто не найден'}`;}
function runOldest(){const u=getOldestUser(U);document.getElementById('out').innerHTML=`<span class="hl">getOldestUser()</span>

Самый старший: <span class="ok">${u.name}</span> — ${u.age} лет (${u.city})`;}
</script>
